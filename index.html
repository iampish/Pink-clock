<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTC-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>a clock idk</title>
  <!--link to your sheet css here-->
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="format-toggle">Switch to 12H</button>

  <div class="clock-container">
    <!--hours-->
    <div class="slot"><div class="digits" id="h-tens"><div>0</div><div>1</div><div>2</div></div></div>
    <div class="slot"><div class="digits" id="h-ones"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div></div></div>

    <div class="colon">:</div>

    <!--minutes-->
    <div class="slot"><div class="digits" id="m-tens"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div></div>
    <div class="slot"><div class="digits" id="m-ones"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div></div></div>

    <div class="colon">:</div>

    <!--Seconds-->
    <div class="slot"><div class="digits" id="s-tens"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div></div></div>
    <div class="slot"><div class="digits" id="s-ones"><div>0</div><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div></div></div>
  </div>

  <!--link to ur javascript f-->
  <script src="script.js"></script>
</body>
</html>
